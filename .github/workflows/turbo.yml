name: Turbo CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Both sandboxes need chromium and its system libraries. Installed once,
      # here, because turbo runs their test tasks in parallel and two concurrent
      # `--with-deps` installs deadlock on the apt lock.
      - name: Install Playwright browsers
        run: pnpm --filter @zbsearch/sandbox-starlight exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
