name = "zbsearch-edge"
main = "../../packages/runtime-cloudflare/src/worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zbsearch-edge"
preview_bucket_name = "zbsearch-edge-preview"

[triggers]
crons = ["*/5 * * * *"]

[vars]
REBUILD_THRESHOLD_OPS = "500"

# Set via `wrangler secret put API_KEY`
# Set via `wrangler secret put BUILDER_WEBHOOK_URL` for external rebuild runner

[limits]
cpu_ms = 300000
