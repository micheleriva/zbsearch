packages:
  - 'packages/*'
  - 'sandboxes/*'
  - 'apps/*'
  - 'benchmarks'

allowBuilds:
  '@swc/core': true
  # Pulled in by the Docusaurus sandbox. Its postinstall only prints a banner.
  core-js: false
  esbuild: true
  # Both are pulled in by transformers.js in the semantic demo. Its encoder runs on
  # WASM in the browser and in the build scripts, so the native ONNX binding is never
  # loaded and there is nothing to gain from downloading and building it.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  workerd: false

enablePrePostScripts: true
verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - typescript@7.0.2

overrides:
  hastscript: ^9.0.1
  # Fumadocs depends on @orama/orama; map only that edge to local zbsearch.
  # Do not override globally — benchmarks must compare against real Orama.
  'fumadocs-core>@orama/orama': 'link:packages/zbsearch'

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - '@babel/plugin-syntax-flow'
    - '@babel/plugin-transform-react-jsx'
    - algoliasearch
    - eslint
    - typescript
